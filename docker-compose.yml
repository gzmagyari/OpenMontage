# OpenMontage video-generator API.   docker compose up -d --build
# Put FAL_KEY, ANTHROPIC_API_KEY and OPENMONTAGE_API_TOKEN in .env (see docs/API.md for all settings).
services:
  openmontage-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openmontage-api:latest
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      OPENMONTAGE_DATA_DIR: /data
    volumes:
      - openmontage-data:/data
    init: true          # reaps headless Chrome processes
    security_opt:       # lets bubblewrap build each job's agent box (docs/API.md, "Agent boxes")
      - seccomp=docker/seccomp-openmontage.json
      - systempaths=unconfined
    shm_size: "2gb"     # Chrome needs more than Docker's 64 MB default /dev/shm
    restart: unless-stopped
    stop_grace_period: 40s  # running jobs are checkpointed and resume on the next start

volumes:
  openmontage-data:
